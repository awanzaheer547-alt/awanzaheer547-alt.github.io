<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page 2 - WhatsApp Rooms</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#eef2f5;font-family:Arial,sans-serif}
.phone{max-width:420px;margin:0 auto;background:#fff;min-height:100vh;border:1px solid #ddd}
.top-tabs{display:flex;justify-content:space-around;padding:12px 0 0;background:#fff}
.top-tabs button{border:0;background:none;font-size:17px;padding:8px 15px;color:#777}
.top-tabs button.active{color:#111;border-bottom:3px solid #25D366;font-weight:bold}
.wa{background:#25D366;color:#fff;text-align:center;padding:12px;font-size:19px;font-weight:bold}
.search{padding:10px}
.search input{width:100%;padding:11px 12px;border-radius:20px;border:0;background:#eef0f2;font-size:14px}
.tab{display:none}
.tab.active{display:block}
.chat{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid #eee;align-items:center}
.chat img{width:50px;height:50px;border-radius:50%;object-fit:cover}
.chat .mid{flex:1}
.chat h3{font-size:15px}
.chat p{font-size:12px;color:#555}
.chat .time{font-size:11px;color:#777;text-align:right}
.badge{background:#25D366;color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;margin:5px 0 0 auto}
.group-item{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid #eee;align-items:center}
.group-item .gicon{width:48px;height:48px;border-radius:50%;background:#0a7a3d;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold}
.group-item h3{font-size:15px}
.group-item p{font-size:12px;color:#555}
.rooms{padding:12px}
.rooms h3{font-size:14px;color:#555;margin-bottom:10px}
.rooms-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rooms-grid a{background:#eafaf0;border:1px solid #25D366;color:#111;text-align:center;padding:13px;border-radius:10px;text-decoration:none;font-weight:bold;font-size:14px}
.bottom{display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ddd;background:#fff;position:sticky;bottom:0}
.bottom a{text-align:center;text-decoration:none;color:#555;font-size:13px}
.bottom a.active{color:#25D366;font-weight:bold}
.back{text-align:center;padding:12px}
.back a{background:#0a7a3d;color:#fff;padding:10px 25px;border-radius:20px;text-decoration:none}
</style>
</head>
<body>
<div class="phone">

<div class="top-tabs">
<button class="active" onclick="showTab('chat',this)">Chat</button>
<button onclick="showTab('status',this)">Status</button>
<button onclick="showTab('call',this)">Call</button>
<button onclick="showTab('group',this)">Group</button>
</div>

<div class="wa">WhatsApp</div>

<div class="search"><input placeholder="Search / تلاش..."></div>

<!-- CHAT -->
<div id="chat" class="tab active">
<div class="chat"><img src="photo1.jpg"><div class="mid"><h3>Baba Jan</h3><p>InshaAllah, we will meet tomorrow - بابا جان نے انشاء اللہ، کل ملیں گے</p></div><div class="time">09:41<div
