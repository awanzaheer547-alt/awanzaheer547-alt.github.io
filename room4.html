<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sawal Jawab Room</title>
<style>
body{font-family:Arial;background:#fff8e1;text-align:center;margin:0;padding:20px}
h1{color:#6a1b9a}
.box{background:white;border:2px solid #6a1b9a;border-radius:15px;padding:20px;max-width:500px;margin:auto}
.q{background:#f3e5f5;border-radius:10px;padding:15px;margin:10px 0;text-align:left}
button{background:#6a1b9a;color:white;padding:10px 18px;border:none;border-radius:10px;font-size:16px;margin:5px}
input{width:90%;padding:12px;margin:8px;border-radius:10px;border:1px solid #ccc}
a{color:#6a1b9a}
</style>
</head>
<body>
<h1>❓ Sawal Jawab Room</h1>
<p>سوال جواب روم</p>
<div class="box">
<div class="q"><b>Sawal:</b> Namaz me kitni Rakaat hain?<br><button onclick="show('A: Fajr 2, Zuhar 4, Asar 4, Maghrib 3, Isha 4')">Jawab Dekhein</button></div>
<div class="q"><b>Sawal:</b> Roza kab Farz hua?<br><button onclick="show('A: Ramzan ka Roza 2 Hijri me Farz hua')">Jawab Dekhein</button></div>
<p id="ans" style="color:#6a1b9a;font-weight:bold"></p>
<hr>
<p>Apna Sawal Likhein:</p>
<input id="s" placeholder="Apna sawal yahan likhein...">
<br>
<button onclick="ask()">Sawal Bhejein</button>
<p id="thanks"></p>
<br>
<a href="index.html">⬅ Wapas 8 Rooms par jayein</a>
</div>
<script>
function show(t){document.getElementById('ans').innerText=t;}
function ask(){
var s=document.getElementById('s').value;
if(s=="")return;
document.getElementById('thanks').innerText="JazakAllah! Aapka sawal mil gaya: "+s;
document.getElementById('s').value="";
}
</script>
</body>
</html>
