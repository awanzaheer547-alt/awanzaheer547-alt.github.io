<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Room - چیٹ روم</title>
<style>
body{font-family:Arial;background:#fef9e7;text-align:center;margin:0;padding:20px}
h1{color:#145a32}
.box{background:white;border:2px solid #145a32;border-radius:15px;padding:20px;max-width:500px;margin:auto}
input{width:90%;padding:12px;margin:8px;border-radius:10px;border:1px solid #ccc}
button{background:#145a32;color:white;padding:12px 25px;border:none;border-radius:10px;font-size:18px}
#chat{text-align:left;height:250px;overflow:auto;border:1px solid #ddd;padding:10px;margin-top:10px;border-radius:10px}
a{color:#145a32}
</style>
</head>
<body>
<h1>💬 Chat Room</h1>
<p>چیٹ روم</p>
<div class="box">
<div id="chat"><p>السلام علیکم! چیٹ روم میں خوش آمدید ❤️</p></div>
<input id="name" placeholder="اپنا نام لکھیں">
<input id="msg" placeholder="پیغام لکھیں...">
<br>
<button onclick="send()">بھیجیں</button>
<br><br>
<a href="index.html">⬅ واپس 8 رومز پر جائیں</a>
</div>
<script>
function send(){
var n=document.getElementById('name').value;
var m=document.getElementById('msg').value;
if(m=="")return;
var d=document.getElementById('chat');
d.innerHTML+="<p><b>"+n+": </b>"+m+"</p>";
document.getElementById('msg').value="";
d.scrollTop=d.scrollHeight;
}
</script>
</body>
</html>
