<!DOCTYPE html><html lang="ur"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DJ Room</title><style>body{font-family:Arial;background:#fffbe6;text-align:center;padding:15px}.box{background:white;border:2px solid #0a6b2e;border-radius:15px;padding:20px;max-width:600px;margin:auto}audio{width:100%}.btn{background:#ffd700;border:none;padding:14px;border-radius:25px;font-weight:bold;font-size:17px;margin:8px;width:90%}a{color:#0a6b2e;font-weight:bold;display:block;margin-top:15px}</style></head><body><div class="box"><h1>🎵 DJ Room</h1><h2>ڈی جے روم</h2><p>Yahan aap ke apne mobile wali Naat / Tilawat chalegi.</p><audio id="player" controls></audio><label class="btn" for="file" style="display:block">📱 Apne Mobile se Naat / Tilawat Chunein</label><input type="file" id="file" accept="audio/*" style="display:none" onchange="playFile(this)"><a href="index.html">← Wapas 8 Rooms par jayein</a></div><script>function playFile(i){let f=i.files[0];if(f){let p=document.getElementById('player');p.src=URL.createObjectURL(f);p.play();}}</script></body></html>
