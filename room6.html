<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کمرہ 6 - اسٹیٹس روم</title>
<style>
body{margin:0;background:#0a3d2e;font-family:Arial;text-align:center;color:white;padding:15px}
h1{color:#ffeb3b}
.box{background:white;color:black;border-radius:15px;padding:15px;max-width:500px;margin:auto}
.status{border:2px solid #25D366;border-radius:15px;padding:10px;margin:10px 0;text-align:right}
input{width:90%;padding:12px;border-radius:10px;border:1px solid #ccc;margin:5px}
button{padding:12px 15px;border:none;border-radius:10px;background:#0a3d2e;color:white;font-weight:bold;margin:3px}
.back{display:block;margin-top:15px;color:white;text-decoration:none}
img{width:100%;border-radius:10px}
</style>
</head>
<body>
<h1>کمرہ 6 - اسٹیٹس روم</h1>
<p>تاجدارِ ختمِ نبوت ﷺ زندہ باد</p>
<div class="box">
<h3>اپنا اسٹیٹس لگائیں</h3>
<input id="name" placeholder="اپنا نام لکھیں...">
<input id="text" placeholder="اسٹیٹس لکھیں...">
<input type="file" id="pic" accept="image/*">
<button onclick="addStatus()">اسٹیٹس لگائیں</button>
<hr>
<h3>دوستوں کے اسٹیٹس</h3>
<div id="list">
<div class="status"><b>احمد بھائی</b><p>تاجدارِ ختمِ نبوت ﷺ زندہ باد</p><button onclick="like(this)">❤️ پسند</button></div>
<div class="status"><b>علی بھائی</b><p>اللہ ہمارا حامی و ناصر ہو</p><button onclick="like(this)">❤️ پسند</button></div>
</div>
</div>
<a class="back" href="index.html">⬅ واپس مرکز میں جائیں</a>
<script>
function addStatus(){
var n=document.getElementById("name").value;
var t=document.getElementById("text").value;
if(n==""||t=="")return alert("نام اور اسٹیٹس لکھیں");
var l=document.getElementById("list");
l.innerHTML="<div class='status'><b>"+n+"</b><p>"+t+"</p><button onclick='like(this)'>❤️ پسند</button></div>"+l.innerHTML;
document.getElementById("text").value="";
alert("آپ کا اسٹیٹس لگ گیا!");
}
function like(b){b.innerHTML="❤️ پسند ہو گیا"; b.style.background="#25D366";}
</script>
</body>
</html>
