<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All World WhatsApp</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0b141a;color:#fff;padding-bottom:70px}
.header{background:#075e54;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header h1{font-size:19px}
.top-name{background:#1a5c2a;text-align:center;padding:8px;font-weight:bold;font-size:16px}
.main-pic{width:100%;display:block;max-height:360px;object-fit:cover;object-position:top}
.social{display:flex;gap:6px;padding:10px;background:#111b21}
.social a{flex:1;text-align:center;text-decoration:none;color:#fff;padding:11px 2px;border-radius:20px;font-weight:bold;font-size:13px}
.yt{background:#ff0000}.fb{background:#1877f2}.wa{background:#25d366}.lk{background:#fe2c55}
.tabs{display:flex;background:#202c33;position:sticky;top:48px;z-index:99}
.tabs button{flex:1;padding:12px;background:none;border:none;color:#aebac1;font-weight:bold}
.tabs button.active{color:#25d366;border-bottom:3px solid #25d366}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.room{background:#202c33;padding:16px;border-radius:12px;text-align:center}
.room span{font-size:28px}
.room b{display:block}
.room small{color:#aebac1;font-size:11px}
.section{display:none;padding:10px}
.section.active{display:block}
.chat{display:flex;gap:10px;padding:10px;background:#111b21;margin-bottom:6px;border-radius:10px;align-items:center}
.dp{width:48px;height:48px;background:#00a884;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.btn{width:100%;background:#25d366;border:none;padding:12px;border-radius:20px;font-weight:bold;margin-top:10px;color:#fff}
input{width:100%;padding:12px;border-radius:8px;border:none;margin-top:8px;color:#000}
.msg-box{display:flex;gap:6px;margin-top:10px}
.msg-box input{margin:0}
.msg-box button{width:80px;background:#25d366;border:none;border-radius:20px;color:#fff;font-weight:bold}
.room-header{background:#075e54;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.room-header b{font-size:17px}
.back{background:#fff;color:#000;border:none;padding:6px 12px;border-radius:20px;font-weight:bold}
.three-dot{background:#202c33;padding:10px;border-radius:10px}
.three-dot div{padding:12px;border-bottom:1px solid #333}
.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;background:#202c33;padding:10px;gap:5px}
.bottom button{flex:1;background:#25d366;border:none;padding:10px;border-radius:20px;font-weight:bold;color:#fff}
</style>
</head>
<body>
<div class="header"><h1>All World WhatsApp</h1><span onclick="showTab('setting')">⋮</span></div>
<div class="top-name">All World WhatsApp - Tahaffuz Khatm-e-Nabuwwat</div>
