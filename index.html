<title>Tahaffuz Khatm-e-Nabuwwat App</title>
<style>
body{margin:0;background:#fdf6e3;font-family:Arial;text-align:center}
img{width:100%;display:block}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.room{background:white;border:3px solid #0a4d2e;border-radius:15px;padding:15px;font-size:18px;color:#0a4d2e;font-weight:bold}
.room span{display:block;font-size:16px;font-weight:normal}
#adbox{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);color:white;flex-direction:column;justify-content:center;align-items:center;z-index:100;padding:20px}
#adbox button{padding:12px 25px;background:orange;border:none;border-radius:10px;color:white;font-size:18px;margin-top:15px}
#lock{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a4d2e;color:white;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99}
#lock input{padding:12px;font-size:18px;text-align:center;border-radius:10px;border:none;margin:10px}
#lock button{padding:12px 25px;background:orange;color:white;border:none;border-radius:10px;font-size:18px}
</style>
</head>
