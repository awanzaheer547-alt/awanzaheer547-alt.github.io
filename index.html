<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tahafuz Khatm-e-Nubuwwat - Page 1</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#eef2f5}
  .header{background:#0a7a3d;color:#fff;text-align:center;padding:14px 10px}
  .header h1{font-size:19px;line-height:1.4}
  .header .markaz{font-size:15px;margin-top:4px}
  .header .rehmat{font-size:14px;margin-top:2px}
  .stats{display:flex;gap:8px;padding:10px}
  .stat{flex:1;background:#fff;border-radius:10px;text-align:center;padding:12px 2px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .stat b{display:block;font-size:18px}
  .stat span{font-size:12px;color:#333}
  .box{background:#fff;margin:0 10px 10px;border-radius:10px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .box h3{text-align:center;font-size:14px;margin-bottom:10px}
  .photos{display:flex;gap:8px}
  .photos figure{flex:1;text-align:center}
  .photos img{width:100%;height:95px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
  .photos figcaption{font-size:11px;margin-top:4px;line-height:1.3}
  .form-box{background:#fff;margin:0 10px 10px;border-radius:10px;padding:12px}
  .form-box h3{text-align:center;margin-bottom:10px}
  .form-box label{font-size:13px;display:block;margin:8px 0 4px}
  .form-box input,.form-box select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:14px}
  .btn{width:100%;background:#0a7a3d;color:#fff;border:0;padding:12px;border-radius:8px;font-size:15px;font-weight:bold;margin-top:12px}
  .labbaik{text-align:center;background:#e8f5e9;margin:0 10px 10px;padding:10px;border-radius:10px;font-weight:bold}
  .links{background:#fff;margin:0 10px 10px;border-radius:10px;padding:12px;text-align:center}
  .links h3{margin-bottom:10px}
  .links a{display:block;text-decoration:none;color:#fff;padding:11px;border-radius:8px;margin-bottom:8px;font-weight:bold;font-size:14px}
  .yt{background:#c00} .tk{background:#000} .likee{background:#ff2d55} .fb{background:#1877f2} .wa{background:#25D366}
</style>
</head>
<body>

<div class="header">
  <h1>تحفظ ختم نبوت آل ورلڈ وائس ایپ</h1>
  <div class="markaz">مرکز</div>
  <div class="rehmat">رحمت اللعالمین ﷺ</div>
</div>

<div class="stats">
  <div class="stat"><b id="online">0</b><span>Online</span></div>
  <div class="stat"><b id="offline">0</b><span>Offline</span></div>
  <div class="stat"><b id="total">0</b><span>Total</span></div>
  <div class="stat"><b id="lifetime">0</b><span>Lifetime Entries</span></div>
</div>

<!-- اوپر والی 3 تصویریں -->
<div class="box">
  <h3>اوپر والی 3 تصویریں</h3>
  <div class="photos">
    <figure><img src="Photo1.jpg"><figcaption>بابا جی خادم حسین رضوی</figcaption></figure>
    <figure><img src="Photo2.jpg"><figcaption>سید ظہیر الحسن شاہ صاحب</figcaption></figure>
    <figure><img src="Photo3.jpg"><figcaption>سید شبیر حسین شاہ صاحب</figcaption></figure>
  </div>
</div>

<!-- نیچے والی 3 تصویریں -->
<div class="box">
  <h3>نیچے والی 3 تصویریں</h3>
  <div class="photos">
    <figure><img src="Photo4.jpg"><figcaption>تصویر 4</figcaption></figure>
    <figure><img src="Photo5.jpg"><figcaption>تصویر 5</figcaption></figure>
    <figure><img src="Photo6.jpg"><figcaption>تصویر 6</figcaption></figure>
  </div>
</div>

<div class="form-box">
  <h3>Entry Form</h3>
  <label>Full Name</label>
  <input id="name" placeholder="اپنا نام لکھیں">
  <label>City</label>
  <input id="city" placeholder="شہر">
  <label>WhatsApp Number</label>
  <input id="phone" placeholder="03xx-xxxxxxx">
  <label>Group</label>
  <select id="group">
    <option>Lahore Group</option>
    <option>Karachi Group</option>
    <option>Islamabad Group</option>
    <option>Rawalpindi Group</option>
    <option>Peshawar Group</option>
    <option>Quetta Group</option>
  </select>
  <button class="btn" onclick="saveEntry()">Submit / جمع کریں</button>
</div>

<!-- آپ کے سارے لنک - Sketch والے -->
<div class="links">
  <h3>ہمارے ساتھ جڑیں</h3>
  <a class="yt" href="https://youtu.be/TkzQPVKAq28?si=ELFnwt1uJW-nlKQy">▶ YouTube دیکھیں</a>
  <a class="tk" href="https://vm.tiktok.com/ZSpW6KGY4/">♪ TikTok دیکھیں</a>
  <a class="likee" href="https://l.likee.video/v/CASyuF">♥ Likee دیکھیں</a>
  <a class="fb" href="https://www.facebook.com/share/1coLeaYWhr/">f Facebook دیکھیں</a>
  <a class="wa" href="https://whatsapp.com/channel/0029Vb9SXgn2UPB8BQi6l62x">WhatsApp Channel Join کریں</a>
</div>

<div class="labbaik">لبیک لبیک لبیک یا رسول اللہ ﷺ</div>

<script>
function saveEntry(){
  alert("Entry Save ہو گئی");
}
</script>
</body>
</html>
