<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All World WhatsApp</title>
<style>
body{margin:0;font-family:sans-serif;background:#fff}
.top{background:#075E54;color:white;padding:12px;text-align:center}
.earning{background:#25D366;color:white;padding:12px;text-align:center;font-weight:bold}
.tabs{background:#075E54;color:white;display:flex;justify-content:space-around;padding:10px;font-weight:bold}
.box{padding:15px}
input{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
button{width:100%;padding:12px;background:#075E54;color:white;border:none;border-radius:8px;font-size:16px}
.adBox{background:#eee;text-align:center;padding:15px;margin:10px;border:1px dashed #888}
</style>
</head>
<body>

<!-- TOP -->
<div class="top"><b>WhatsApp</b><br>🔍 📷 ⋮</div>
<div class="tabs"><span>Chats</span><span>Status</span><span>Calls</span><span>Groups</span></div>

<!-- 1. EARNING BOX - AD 1 -->
<div class="earning">Earning Box - Total: 0 | Online: 0 | Offline: 0</div>
<div class="adBox">
<b>Ad 1 - Earning Box Wala Ad</b><br>
<!-- Apni Ad 1 ki ID yahan lagayen -->
<div id="ad1">Ad Yahan Aayega</div>
</div>

<!-- 2. ENTRY - PEHLE AD, PHIR ENTRY -->
<div class="box" id="entryBox">
<h3>Entry - Pehle Ad Dekhen, Phir Entry Karen</h3>
<button onclick="showEntryAd()">1 Ad Dekhen - Entry Ke Liye</button>
<p id="adStatus" style="text-align:center;color:green"></p>

<div id="formBox" style="display:none">
<input id="name" placeholder="Poora Naam">
<input id="cnic" placeholder="Shanakhti Card Number">
<input id="address" placeholder="Poora Address">
<input id="gmail" placeholder="Gmail ID">
<label>DP Photo:</label> <input type="file"><br><br>
<label>Cover Photo:</label> <input type="file"><br><br>
<button onclick="enterRoom()">Room Me Entry Karen</button>
</div>
</div>

<!-- 3. ACCOUNT PAGE - AD 2 -->
<div class="box" id="accountBox" style="display:none">
<h3>Mera Account</h3>
<p id="userInfo"></p>
<div class="adBox">
<b>Ad 2 - Account Wala Ad</b><br>
<!-- Apni Ad 2 ki ID yahan lagayen -->
<div id="ad2">Ad Yahan Aayega</div>
</div>
<button onclick="goToGroups()">Groups Me Jayen</button>
</div>

<!-- 4. GROUPS - PAKISTAN KE SHEHAR -->
<div class="box" id="groupBox" style="display:none">
<h3>Groups - Pakistan Ke Shehar</h3>
<div id="groups"></div>
</div>

<script>
// ENTRY AD - HAR BANDA, HAR DAFA 1 AD DEKHEGA
let adSeen = false;
function showEntryAd(){
  // Yahan Apna Interstitial Ad Lagayen - Ad 1 ya Ad 2
  alert("Ad Chal Raha Hai... Ad Dekhen, Phir Entry Khulegi");
  // Ad khatam hone ke baad:
  adSeen = true;
  document.getElementById("adStatus").innerText = "Shukriya, Ad Dekh Liya, Ab Entry Karen";
  document.getElementById("formBox").style.display = "block";
}

function enterRoom(){
  if(!adSeen){
    alert("Pehle 1 Ad Dekhna Lazmi Hai");
    return;
  }
  let name = document.getElementById("name").value;
  if(name==""){ alert("Naam Likhen"); return; }
  document.getElementById("entryBox").style.display="none";
  document.getElementById("accountBox").style.display="block";
  document.getElementById("userInfo").innerText = "Mubarak Ho " + name + ", Aapki Entry Ho Gayi";
}

function goToGroups(){
  document.getElementById("accountBox").style.display="none";
  document.getElementById("groupBox").style.display="block";
  let cities = ["Lahore","Karachi","Islamabad","Rawalpindi","Faisalabad","Multan","Hyderabad","Peshawar","Quetta","Bahawalpur","Sialkot","Gujranwala","Hafizabad"];
  let box = document.getElementById("groups");
  cities.forEach(city=>{
    box.innerHTML += `<div style="padding:12px;border-bottom:1px solid #eee"><b>${city} Group</b><br><span>All World - ${city}</span> <button style="width:auto;float:right" onclick="alert('${city} Me Add Ho Gaye')">Join</button></div>`;
  });
}
</script>

</body>
</html>
