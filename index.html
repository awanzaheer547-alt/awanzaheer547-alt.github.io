<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All World WhatsApp</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0b141a;color:#fff;padding-bottom:70px}
.header{background:#075e54;padding:10px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:20px}
.header span{font-size:22px}
.main{background:#fdf6e3;color:#000;padding:12px;text-align:center}
.main .green{background:#0b5a2e;color:#fff;padding:10px;border:3px solid #c9a227}
.main .green h2{font-size:21px}
.main .green b{display:block}
.main .green small{font-size:13px}
.pics{margin-top:10px}
.pics .top-pic{width:150px;height:150px;object-fit:cover;border:3px solid #fff;box-shadow:0 0 5px #999}
.pics .row{display:flex;justify-content:center;gap:10px;margin-top:10px}
.pics .row div{flex:1}
.pics .row img{width:100%;height:110px;object-fit:cover;border:3px solid #fff}
.name-tag{background:#fff8c5;border:1px solid #c9a227;font-size:10px;padding:3px;border-radius:10px;margin-top:3px}
.links{display:flex;gap:6px;justify-content:center;margin-top:12px}
.links button{padding:8px 10px;border:none;border-radius:15px;font-weight:bold}
.labbaik{font-size:28px;color:#8a6d00;margin-top:10px;font-weight:bold}
.tabs{display:flex;background:#202c33;position:sticky;top:0;z-index:10}
.tabs button{flex:1;padding:12px;background:none;border:none;color:#aebac1;font-weight:bold}
.tabs button.active{color:#25d366;border-bottom:3px solid #25d366}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.room{background:#202c33;padding:16px;border-radius:12px;text-align:center}
.room span{font-size:28px}
.room b{display:block;margin-top:5px}
.room small{color:#aebac1;font-size:11px}
.section{display:none;padding:10px}
.section.active{display:block}
.chat{display:flex;gap:10px;padding:10px;background:#111b21;margin-bottom:6px;border-radius:10px;align-items:center}
.dp{width:48px;height:48px;background:#00a884;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;flex-shrink:0}
.dp img{width:100%;height:100%;object-fit:cover}
.chat b{font-size:14px}
.chat small{color:#aebac1;display:block;font-size:12px}
.btn{width:100%;background:#25d366;border:none;padding:12px;border-radius:20px;font-weight:bold;margin-top:10px}
input,select{width:100%;padding:10px;border-radius:8px;border:none;margin-top:8px;color:#000}
.three-dot{background:#202c33;padding:10px;border-radius:10px;margin-top:10px}
.three-dot
