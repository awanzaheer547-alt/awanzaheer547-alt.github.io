<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کمرہ 1 - چیٹ روم</title>
<style>
body{margin:0;background:#0a3d2e;font-family:Arial;text-align:center;color:white;padding:15px}
h1{color:#ffeb3b}
.box{background:white;color:black;border-radius:15px;padding:15px;max-width:500px;margin:auto}
#chat{height:280px;overflow:auto;border:1px solid #ccc;border-radius:10px;padding:10px;background:#f9f9f9;text-align:right}
input{width:65%;padding:12px;border-radius:10px;border:1px solid #ccc}
button{padding:12px 10px;border:none;border-radius:10px;background:#0a3d2e;color:white;font-weight:bold;margin:3px}
.call{background:#25D366}
.video{background:#1877F2}
.back{display:block;margin-top:15px;color:white;text-decoration:none}
</style>
</head>
<body>
<h1>کمرہ 1 - TLP چیٹ روم</h1>
<p>تاجدارِ ختمِ نبوت ﷺ زندہ باد</p>
<div class="box">
<div id="chat"><p>خوش آمدید! یہاں سب بھائی چیٹ کریں گے۔</p></div>
<br>
<input id="msg" placeholder="پیغام لکھیں...">
<button onclick="send()">بھیجیں</button>
<br><br>
<button onclick="voice()">🎤 وائس میسج</button>
<button class="call" onclick="audioCall()">📞 آڈیو کال</button>
<button class="video" onclick="videoCall()">📹 ویڈیو کال</button>
<p id="info" style="color:green"></p>
</div>
<a class="back" href="index.html">⬅ واپس مرکز میں جائیں</a>
<script>
function send(){
var m=document.getElementById("msg").value;
if(m=="")return;
var c=document.getElementById("chat");
c.innerHTML+="<p><b>آپ:</b> "+m+"</p>";
document.getElementById("msg").value="";
c.scrollTop=c.scrollHeight;
}
function voice(){
document.getElementById("info").innerHTML="وائس ریکارڈنگ شروع ہو گئی ہے، بولیں...";
var c=document.getElementById("chat");
c.innerHTML+="<p><b>آپ:</b> 🎤 وائس میسج بھیجا</p>";
}
function audioCall(){
window.open("https://meet.jit.si/TLP-Room1-Audio","_blank");
}
function videoCall(){
window.open("https://meet.jit.si/TLP-Room1-Video","_blank");
}
</script>
</body>
</html>
