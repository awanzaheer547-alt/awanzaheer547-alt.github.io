<!-- Room 5 - Chat + Tehreek Room -->

<div id="room5">
  <h2>Room 5 - Chat Aur Tehreek Room</h2>

  <div style="border:2px solid green; padding:20px; text-align:center;">
    <p>Google Ad Yahan Chalega</p>
    <p>Ad Dekhen, Phir Chat Shuru Hogi</p>
  </div>

  <br>
  <button onclick="adDekha()">Ad Dekh Liya</button>

  <hr>

  <h3>Tehreek Ka Paigham</h3>
  <p id="paigham">Yahan Tehreek Ka Paigham Aayega</p>
  <button onclick="paighamDikhao()">Paigham Dekhen</button>

  <br><br>
  <video controls width="100%">
    <source src="tehreek-video.mp4" type="video/mp4">
    Aapka Video Yahan Chalega
  </video>

  <br><br>
  <img src="tehreek-photo.jpg" width="100%">
  <p>Tehreek Ki Tasveer Yahan Aayegi</p>

  <hr>

  <h3>Do Doston Ki Chat</h3>
  <div id="chatBox" style="border:1px solid black; height:150px; padding:10px;">
    <p><b>Bhai 1:</b> Assalam-o-Alaikum</p>
    <p><b>Bhai 2:</b> Walaikum Assalam</p>
  </div>

  <br>
  <input type="text" id="msg" placeholder="Apna Paigham Likhen">
  <button onclick="sendMsg()">Bhejen</button>

  <p>Aapki Earning: <span id="earning5">0</span></p>
</div>

<script>
  function adDekha() {
    alert("Mubarak Ho! Ad Dekh Liya");
  }
  function paighamDikhao() {
    document.getElementById("paigham").innerText = "Tehreek Ka Paigham: Mehnat Karo, Iman Mazboot Rakho";
    alert("Paigham Aa Gaya");
  }
  function sendMsg() {
    var m = document.getElementById("msg").value;
    var box = document.getElementById("chatBox");
    box.innerHTML += "<p><b>Aap:</b> " + m + "</p>";
    document.getElementById("earning5").innerText = "10";
    document.getElementById("msg").value = "";
  }
</script>
